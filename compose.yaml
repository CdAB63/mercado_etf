services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mercado
      POSTGRES_USER: mercado
      POSTGRES_PASSWORD: ${MERCADO_DB_PASSWORD:?Defina MERCADO_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mercado_data:/var/lib/postgresql/data
volumes:
  mercado_data:
